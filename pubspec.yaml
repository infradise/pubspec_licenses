name: pubspec_licenses
description: Zero-dependency Dart library and CLI to extract OSS licenses and SPDX identifiers from pubspec.lock. Drop-in replacement for dart_pubspec_licenses.
version: 1.1.0
homepage: https://github.com/infradise/pubspec_licenses
repository: https://github.com/infradise/pubspec_licenses
issue_tracker: https://github.com/infradise/pubspec_licenses/issues
topics:
  - license
  - pubspec
  - oss
  - spdx
  - dependencies

environment:
  sdk: '>=3.0.0 <4.0.0'

executables:
  pubspec_licenses: pubspec_licenses
  generate: generate
