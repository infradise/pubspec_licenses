name: Check Preflight

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verification mode: strict (release-ready 160/160) or wip (for -wip feature branches)'
        required: true
        default: 'strict'
        type: choice
        options:
          - strict
          - wip

permissions:
  contents: read

concurrency:
  group: check-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-matrix:
    name: Test & Analyze (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter & Dart (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Verify Dart formatting
        if: matrix.os == 'ubuntu-latest'
        run: dart format --output=none --set-exit-if-changed .

      - name: Run strict static analysis
        run: dart analyze --fatal-infos --fatal-warnings .

      - name: Run zero-dependency test suite
        run: dart run test/run_all_tests.dart

      - name: Run CLI executable smoke check
        shell: bash
        run: |
          dart run bin/pubspec_licenses.dart --help > /dev/null
          dart run bin/generate.dart --json --output "${RUNNER_TEMP}/smoke_oss.json"
          test -s "${RUNNER_TEMP}/smoke_oss.json"

  pub-preflight:
    name: Pub.dev Score & Publish Gate
    runs-on: ubuntu-latest
    env:
      PREFLIGHT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'strict' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Flutter & Dart (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify zero-dependency purity & repository hygiene
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          pubspec = Path('pubspec.yaml').read_text(encoding='utf-8')
          for section in ('dependencies', 'dev_dependencies', 'dependency_overrides'):
              m = re.search(rf'^{section}:\s*(.*?)(?=^\S|\Z)', pubspec, flags=re.M | re.S)
              if m:
                  body = '\n'.join(
                      line for line in m.group(1).splitlines()
                      if line.strip() and not line.strip().startswith('#')
                  ).strip()
                  if body and body != '{}':
                      print(f'ERROR: Non-empty {section} found in pubspec.yaml:\n{body}')
                      sys.exit(1)

          raw_matches = subprocess.run(
              [
                  'git', 'grep', '-n', '-I', '-E',
                  r'(/Users/[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+|[A-Za-z]:\\+Users\\+[A-Za-z0-9._-]+)',
                  '--', '.', ':!.github/workflows/',
              ],
              capture_output=True, text=True
          )
          allow_users = {
              'user', 'users', 'alice', 'bob', 'demo', 'dev', 'example', 'project',
              'test', 'runner', 'runneradmin', 'ubuntu', 'public', 'shared', 'default',
          }
          user_pat = re.compile(
              r'(?:/Users/|/home/|[A-Za-z]:\\+Users\\+)([A-Za-z0-9._-]+)'
          )
          leaked_lines = []
          for line in raw_matches.stdout.splitlines():
              users = [m.group(1).lower() for m in user_pat.finditer(line)]
              if any(u not in allow_users for u in users):
                  leaked_lines.append(line)
          if leaked_lines:
              print('ERROR: Hardcoded personal path detected:\n' + '\n'.join(leaked_lines))
              sys.exit(1)

          print('Zero-dependency purity and path hygiene verified.')
          PY

      - name: Activate pana
        run: dart pub global activate pana

      - name: Run pana & enforce score gate
        shell: bash
        run: |
          dart pub global run pana --json . > "${RUNNER_TEMP}/pana_report.json"
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          mode = os.environ['PREFLIGHT_MODE']
          report_path = Path(os.environ['RUNNER_TEMP']) / 'pana_report.json'
          data = json.loads(report_path.read_text(encoding='utf-8'))

          sections = data.get('report', {}).get('sections', [])
          granted_total = sum(s.get('grantedPoints', 0) for s in sections)
          max_total = sum(s.get('maxPoints', 0) for s in sections)

          summary_lines = [
              f'### Pub.dev Preflight Scorecard (`mode: {mode}`)',
              '',
              '| Category | ID | Score | Status |',
              '| :--- | :--- | :---: | :---: |',
          ]
          failures = []

          for s in sections:
              sid = s.get('id', '')
              title = s.get('title', sid)
              gp = s.get('grantedPoints', 0)
              mp = s.get('maxPoints', 0)
              status = s.get('status', '')
              summary_lines.append(f'| {title} | `{sid}` | {gp} / {mp} | {status} |')

              if gp < mp:
                  if mode == 'wip' and sid == 'convention':
                      continue
                  failures.append(f"[{sid}] {title}: {gp}/{mp}\n{s.get('summary', '')}")

          summary_lines.append(f'| **Total** | | **{granted_total} / {max_total}** | |')
          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(summary_lines) + '\n')

          print('\n'.join(summary_lines))

          if mode == 'strict' and (granted_total < max_total or max_total == 0):
              print('\nERROR: Strict mode requires full max points (zero deductions).')
              for item in failures:
                  print(item)
              sys.exit(1)

          if failures:
              print(f'\nERROR: Preflight failed in {mode} mode:')
              for item in failures:
                  print(item)
              sys.exit(1)
          PY

      - name: Verify version, CHANGELOG, git cleanliness & pub publish --dry-run
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Working tree is dirty before publish check:"
            git status --short
            exit 1
          fi

          VERSION=$(python3 -c "import re, pathlib; m = re.search(r'^version:\s*([^\s#]+)', pathlib.Path('pubspec.yaml').read_text(), re.M); print(m.group(1).strip('\"\'') if m else '')")
          echo "Detected package version: ${VERSION} (mode: ${PREFLIGHT_MODE})"

          if [ "${PREFLIGHT_MODE}" = "strict" ]; then
            case "${VERSION}" in
              *-wip*)
                echo "ERROR: -wip version (${VERSION}) cannot pass strict release gate."
                exit 1
                ;;
            esac

            python3 - "${VERSION}" <<'PY'
          import re, sys
          from pathlib import Path
          ver = sys.argv[1]
          cl = Path('CHANGELOG.md').read_text(encoding='utf-8')
          if not re.search(rf'^##\s+\[?{re.escape(ver)}\]?\b', cl, flags=re.M):
              print(f'ERROR: CHANGELOG.md does not contain a "## {ver}" release heading.')
              sys.exit(1)
          PY

            DRY_OUT="${RUNNER_TEMP}/publish_dry_run.txt"
            dart pub publish --dry-run | tee "${DRY_OUT}"
            if grep -E '^├── (\.github|test)\b' "${DRY_OUT}"; then
              echo "ERROR: .github or test directory leaked into published archive!"
              exit 1
            fi
          else
            echo "WIP mode: inspecting archive file layout (warnings for -wip version allowed)..."
            DRY_OUT="${RUNNER_TEMP}/publish_dry_run.txt"
            dart pub publish --dry-run > "${DRY_OUT}" 2>&1 || true
            cat "${DRY_OUT}"
            if grep -E '^├── (\.github|test)\b' "${DRY_OUT}"; then
              echo "ERROR: .github or test directory leaked into published archive!"
              exit 1
            fi
          fi
